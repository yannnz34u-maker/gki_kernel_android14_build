name: Build POCO X7 GKI 6.1

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GKI branch"
        required: true
        default: "android14-6.1-2026-03"

      release:
        description: "Release tag"
        required: true
        default: "android14-6.1-2026-03_r5"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            python3-pip \
            zip \
            unzip \
            cpio \
            rsync \
            lz4 \
            zstd

      - name: Download AOSP GKI release JSON
        run: |
          curl -L \
            "https://source.android.com/static/docs/core/architecture/kernel/gki-android14-6_1-release-builds.json" \
            -o gki-releases.json

          python3 -m json.tool gki-releases.json > /dev/null

          echo "AOSP JSON OK"

      - name: Get GKI release information
        id: gki
        env:
          BRANCH: ${{ inputs.branch }}
          RELEASE: ${{ inputs.release }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          branch_name = os.environ["BRANCH"]
          release_tag = os.environ["RELEASE"]

          with open("gki-releases.json", "r") as f:
              data = json.load(f)

          found = None

          for branch in data["branches"]:
              if branch["name"] != branch_name:
                  continue

              for release in branch["releases"]:
                  if release["tag"] == release_tag:
                      found = {
                          "branch": branch["name"],
                          "kernel_version": branch["kernel_version"],
                          "tag": release["tag"],
                          "sha1": release["sha1"],
                          "kernel_bid": release["kernel_bid"]
                      }
                      break

          if found is None:
              print("GKI release tidak ditemukan!")
              sys.exit(1)

          print("Branch       :", found["branch"])
          print("Kernel       :", found["kernel_version"])
          print("Tag          :", found["tag"])
          print("SHA1         :", found["sha1"])
          print("Kernel BID   :", found["kernel_bid"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"branch={found['branch']}\n")
              out.write(f"kernel_version={found['kernel_version']}\n")
              out.write(f"tag={found['tag']}\n")
              out.write(f"sha1={found['sha1']}\n")
              out.write(f"kernel_bid={found['kernel_bid']}\n")
          PY

      - name: Clone AOSP kernel common
        run: |
          git clone \
            https://android.googlesource.com/kernel/common.git \
            kernel

          cd kernel

          git fetch --depth=1 origin \
            ${{ steps.gki.outputs.sha1 }}

          git checkout \
            ${{ steps.gki.outputs.sha1 }}

          echo "===== GKI COMMIT ====="
          git rev-parse HEAD

          echo "===== KERNEL VERSION ====="
          make kernelversion

      - name: Clone AOSP Clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

      - name: Setup Clang
        run: |
          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -name clang \
            | head -n 1 \
            | xargs dirname)

          if [ -z "$CLANG_BIN" ]; then
            echo "Clang tidak ditemukan!"
            exit 1
          fi

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "CLANG_BIN=$CLANG_BIN"

      - name: Configure GKI
        working-directory: kernel
        run: |
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig


      - name: Build Image
        working-directory: kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify kernel
        run: |
          echo "=============================="
          echo "GKI BUILD RESULT"
          echo "=============================="

          test -f \
            kernel/out/arch/arm64/boot/Image

          ls -lh \
            kernel/out/arch/arm64/boot/Image

          file \
            kernel/out/arch/arm64/boot/Image

          echo "=============================="
          echo "Kernel version:"
          echo "=============================="

          cat kernel/out/include/config/kernel.release

      - name: Package Image
        run: |
          mkdir -p release

          cp \
            kernel/out/arch/arm64/boot/Image \
            release/Image

          cp \
            gki-releases.json \
            release/

          cat > release/BUILD_INFO.txt <<EOF
          Device: POCO X7
          Codename: malachite

          GKI Branch: ${{ steps.gki.outputs.branch }}
          Kernel Version: ${{ steps.gki.outputs.kernel_version }}
          GKI Tag: ${{ steps.gki.outputs.tag }}
          SHA1: ${{ steps.gki.outputs.sha1 }}
          Kernel BID: ${{ steps.gki.outputs.kernel_bid }}
          EOF

      - name: Upload GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X7-GKI-${{ steps.gki.outputs.tag }}
          path: release/pocox7
