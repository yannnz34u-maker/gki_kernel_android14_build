name: Build GKI Kernel (Android14-6.1)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支'
        required: true
        default: 'common-android14-6.1'
      build_config:
        description: '构建配置 (build.config 文件名)'
        required: true
        default: 'build.config.gki.aarch64'

env:
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 显示 Runner 硬件信息
        run: |
          echo "=== CPU 信息 ==="
          nproc
          free -h
          df -h /
          echo "=== 磁盘空间 ==="
          df -h

      - name: 安装编译依赖 + ccache + repo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex \
            git libelf-dev libssl-dev lz4 lzip ninja-build \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            dwarves kmod
          # 安装 repo 工具
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          echo "=== 工具链版本 ==="
          aarch64-linux-gnu-gcc --version | head -1
          repo --version || true

      - name: 创建 4GB Swap
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "Swap 已创建"
          else
            echo "Swap 已存在"
          fi
          free -h

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gki-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-gki-${{ inputs.kernel_branch }}-

      - name: 使用 repo 下载 Google 官方内核源代码
        run: |
          echo "=== 使用 repo 下载 ${{ inputs.kernel_branch }} ==="
          mkdir -p gki-kernel
          cd gki-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ inputs.kernel_branch }}
          repo sync -c -j$(nproc)

          echo "=== 目录结构 ==="
          ls -la
          echo "=== common 目录 ==="
          ls -la common/ 2>/dev/null || true
          echo "=== 内核版本 ==="
          head -5 common/Makefile 2>/dev/null || head -5 Makefile 2>/dev/null || true

      - name: 编译 GKI 内核
        run: |
          cd gki-kernel/common

          # 设置环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache aarch64-linux-gnu-gcc"
          export CCACHE_COMPRESS=1

          echo "=== 生成 defconfig ==="
          make ARCH=arm64 gki_defconfig

          echo "=== 禁用 BTF (pahole 在 build.sh 环境中不可用) ==="
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --disable DEBUG_INFO_BTF_MODULES
          make ARCH=arm64 olddefconfig

          echo "=== 开始编译 ==="
          make -j$(nproc) \
            ARCH=arm64 \
            CC="ccache aarch64-linux-gnu-gcc" \
            CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== 编译完成 ==="
          ls -lh arch/arm64/boot/Image*

      - name: 克隆 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          echo "=== AnyKernel3 目录 ==="
          ls -la AnyKernel3/

      - name: 打包 AnyKernel3 刷机包
        run: |
          KERNEL_IMG="gki-kernel/common/arch/arm64/boot/Image"
          KERNEL_GZ="gki-kernel/common/arch/arm64/boot/Image.gz"

          if [ ! -f "$KERNEL_IMG" ]; then
            echo "ERROR: 找不到内核镜像 Image"
            exit 1
          fi

          # 获取内核版本
          KERNEL_VERSION=$(cd gki-kernel/common && make ARCH=arm64 kernelrelease 2>/dev/null || echo "gki")
          echo "内核版本: $KERNEL_VERSION"

          # 复制内核镜像到 AnyKernel3
          cp "$KERNEL_GZ" AnyKernel3/Image.gz 2>/dev/null || cp "$KERNEL_IMG" AnyKernel3/Image 2>/dev/null

          # 修改 anykernel3.sh 配置
          sed -i 's|kernel.string=.*|kernel.string=GKI Android14-6.1 (arm64)|' AnyKernel3/anykernel3.sh
          sed -i 's|block=.*|block=auto;|' AnyKernel3/anykernel3.sh
          # GKI 内核使用 Image.gz
          if [ -f "$KERNEL_GZ" ]; then
            sed -i 's|kernel_type=.*|kernel_type=Image.gz|' AnyKernel3/anykernel3.sh
          else
            sed -i 's|kernel_type=.*|kernel_type=Image|' AnyKernel3/anykernel3.sh
          fi

          echo "=== anykernel3.sh 配置 ==="
          head -30 AnyKernel3/anykernel3.sh

          # 打包 AK3 zip
          cd AnyKernel3
          rm -rf .git .github
          zip -r9 ../GKI-Android14-6.1-AK3.zip * -x "*.git*"
          cd ..

          echo "=== AK3 刷机包 ==="
          ls -lah GKI-Android14-6.1-AK3.zip

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp gki-kernel/common/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp gki-kernel/common/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp GKI-Android14-6.1-AK3.zip artifacts/ 2>/dev/null || true

          echo "=== 产物列表 ==="
          ls -lah artifacts/

      - name: 保存 ccache 统计
        run: |
          ccache -s || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Android14-6.1-arm64
          path: artifacts/*
          retention-days: 30
