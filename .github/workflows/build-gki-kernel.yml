name: Build GKI Kernel (Android14-6.1)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支'
        required: true
        default: 'common-android14-6.1'
      build_config:
        description: '构建配置 (build.config 文件名)'
        required: true
        default: 'build.config.gki.aarch64'

env:
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 显示 Runner 硬件信息
        run: |
          echo "=== CPU 信息 ==="
          nproc
          free -h
          df -h /
          echo "=== 磁盘空间 ==="
          df -h

      - name: 安装编译依赖 + ccache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex \
            git libelf-dev libssl-dev lz4 lzip ninja-build \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "=== 工具链版本 ==="
          aarch64-linux-gnu-gcc --version | head -1

      - name: 创建 4GB Swap
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "Swap 已创建"
          else
            echo "Swap 已存在"
          fi
          free -h

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gki-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-gki-${{ inputs.kernel_branch }}-

      - name: 克隆 Google 官方内核源代码
        run: |
          echo "=== 克隆 android/common ${{ inputs.kernel_branch }} ==="
          git clone --depth=1 --single-branch \
            -b ${{ inputs.kernel_branch }} \
            https://android.googlesource.com/kernel/common kernel
          cd kernel
          echo "=== 最新提交 ==="
          git log -1 --oneline
          echo "=== 内核版本 ==="
          head -5 Makefile

      - name: 编译 GKI 内核
        run: |
          cd kernel

          # 设置环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache aarch64-linux-gnu-gcc"
          export CCACHE_COMPRESS=1

          echo "=== 使用 build.config: ${{ inputs.build_config }} ==="

          # 使用内核自带的 build.sh + build.config 进行编译
          # 这是 Google 官方推荐的编译方式
          if [ -f "build.config.gki.aarch64" ]; then
            echo "找到 GKI build.config，使用官方 build.sh 编译"
            BUILD_CONFIG=${{ inputs.build_config }} build/build.sh
          else
            echo "未找到 build.config，使用标准 defconfig 编译"
            make gki_defconfig
            make -j$(nproc) \
              CC="ccache aarch64-linux-gnu-gcc" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              ARCH=arm64
          fi

          echo "=== 编译完成 ==="
          ls -lh arch/arm64/boot/Image*

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cd kernel

          # 内核镜像
          cp arch/arm64/boot/Image ../artifacts/ 2>/dev/null || true
          cp arch/arm64/boot/Image.gz ../artifacts/ 2>/dev/null || true

          # 内核模块
          find . -name "*.ko" -exec cp {} ../artifacts/ \; 2>/dev/null || true

          # vmlinux (用于调试)
          cp vmlinux ../artifacts/ 2>/dev/null || true

          # kernel-headers (用于模块编译)
          if [ -f out/ ]; then
            cp -r out/ ../artifacts/kernel-out/ 2>/dev/null || true
          fi

          cd ..
          echo "=== 产物列表 ==="
          ls -lah artifacts/

      - name: 保存 ccache 统计
        run: |
          ccache -s || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Android14-6.1-arm64
          path: artifacts/*
          retention-days: 30
