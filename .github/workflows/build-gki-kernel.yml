name: Build GKI android14-6.1.174

# Target: android14-6.1.174_r00
# commit kernel/common (terverifikasi): 8a20a57e3d2fbfb94c9548b002ed0298f93d4e75
# https://android.googlesource.com/kernel/common/+/refs/tags/android14-6.1.174_r00

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.name "gki-build-bot"
          git config --global user.email "gki-build-bot@example.com"
          git config --global color.ui false

      # branch ini terverifikasi ada & dipakai untuk build serupa (lihat referensi NXP)
      - name: repo init (branch common-android14-6.1, untuk tooling bazel/build)
        run: |
          mkdir -p ~/kernel && cd ~/kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android14-6.1 \
                    --depth=1

      - name: repo sync
        run: |
          cd ~/kernel
          repo sync -c -j$(nproc) --no-tags -q

      # override folder common/ agar tepat di commit android14-6.1.174_r00
      # (repo sync di atas menarik HEAD terbaru branch, bukan versi .174 persis)
      - name: Checkout kernel/common tepat ke commit android14-6.1.174_r00
        run: |
          cd ~/kernel/common
          git fetch --depth=1 origin 8a20a57e3d2fbfb94c9548b002ed0298f93d4e75
          git checkout -q FETCH_HEAD
          echo "Kernel/common sekarang di commit: $(git rev-parse HEAD)"
          echo "(harus 8a20a57e3d2fbfb94c9548b002ed0298f93d4e75)"

      - name: Build GKI aarch64 (bazel)
        run: |
          cd ~/kernel
          tools/bazel run --disk_cache=/home/runner/.cache/bazel \
                    --config=fast --config=stamp --lto=thin \
                    //common:kernel_aarch64_dist -- --dist_dir=dist

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: gki-android14-6.1.174-aarch64
          path: ~/kernel/dist/*
          retention-days: 14
            https://android.googlesource.com/kernel/common.git \
            kernel

          cd kernel

          git fetch --depth=1 origin \
            ${{ steps.gki.outputs.sha1 }}

          git checkout \
            ${{ steps.gki.outputs.sha1 }}

          echo "===== GKI COMMIT ====="
          git rev-parse HEAD

          echo "===== KERNEL VERSION ====="
          make kernelversion

      - name: Clone AOSP Clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

      - name: Setup Clang
        run: |
          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -name clang \
            | head -n 1 \
            | xargs dirname)

          if [ -z "$CLANG_BIN" ]; then
            echo "Clang tidak ditemukan!"
            exit 1
          fi

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "CLANG_BIN=$CLANG_BIN"

      - name: Configure GKI
        working-directory: kernel
        run: |
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig


      - name: Build Image
        working-directory: kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify kernel
        run: |
          echo "=============================="
          echo "GKI BUILD RESULT"
          echo "=============================="

          test -f \
            kernel/out/arch/arm64/boot/Image

          ls -lh \
            kernel/out/arch/arm64/boot/Image

          file \
            kernel/out/arch/arm64/boot/Image

          echo "=============================="
          echo "Kernel version:"
          echo "=============================="

          cat kernel/out/include/config/kernel.release

      - name: Package Image
        run: |
          mkdir -p release

          cp \
            kernel/out/arch/arm64/boot/Image \
            release/Image

          cp \
            gki-releases.json \
            release/

          cat > release/BUILD_INFO.txt <<EOF
          Device: POCO X7
          Codename: malachite

          GKI Branch: ${{ steps.gki.outputs.branch }}
          Kernel Version: ${{ steps.gki.outputs.kernel_version }}
          GKI Tag: ${{ steps.gki.outputs.tag }}
          SHA1: ${{ steps.gki.outputs.sha1 }}
          Kernel BID: ${{ steps.gki.outputs.kernel_bid }}
          EOF

      - name: Upload GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X7-GKI-${{ steps.gki.outputs.tag }}
          path: release/pocox7
